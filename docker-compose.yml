version: '3.8'

services:
  energy:
    image: energy_agent:v1.0.0
    container_name: energy
    restart: always
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
    - "9500:8000"
    volumes:
      # 本文件放在项目根目录：与远端当前 energy_agent_v1 -> /app 一致。
      # app 从 /app/.env 读取业务配置；修改代码后受控重启，不启用 --reload。
      - .:/app
    environment:
      - TZ=Asia/Shanghai

  # 刷量服务：模拟真实用户，持续调用智能体接口
  # 启动方式: docker-compose --profile load-test up -d
  load-test:
    image: energy_agent:v1.0.0
    container_name: energy-load-test
    restart: unless-stopped
    working_dir: /app
    command: >
      python scripts/load_test.py
      --url http://energy:8000
      --daemon
      --active-hours 8-22
      --interval 2h
      --jitter 30m
      --sessions-per-round 8
      --concurrency 3
      --mode blocking
      --log-file logs/load_test.log
      --skip-health-check
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - energy
    profiles:
      - load-test

networks:
  default:
    external: true
    name: dify110_default
