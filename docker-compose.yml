version: '3.8'

services:
  energy:
    image: energy_agent:v1.0.0
    container_name: energy
    restart: always
    ports:
    - "9500:8000"
    volumes:
      - /home/sunlu/energy_angent/docker_run:/app
      - /home/sunlu/energy_angent/docker_runlogs:/app/logs
    environment:
      - TZ=Asia/Shanghai

networks:
  default:
    external: true
    name: dify110_default
