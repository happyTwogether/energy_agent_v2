<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能效智能体</title>
<script src="static/js/marked.min.js"></script>
<style>
  :root {
    --bg-primary: #0f0f10;
    --bg-secondary: #1a1a1e;
    --bg-tertiary: #252529;
    --bg-card: #1e1e22;
    --border: #2e2e35;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a0;
    --text-muted: #555565;
    --accent: #4a7cff;
    --accent-hover: #6b96ff;
    --user-bubble: #1e2d4a;
    --thinking-bg: #171720;
    --thinking-border: #2a2a3a;
    --tool-call-bg: #1a2030;
    --tool-result-bg: #1a2a1a;
    --error-bg: #2a1a1a;
    --error-border: #5a2020;
    --scrollbar: #2e2e38;
    --radius: 12px;
    --radius-sm: 8px;
  }

  /* 浅色主题 */
  :root[data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f9fa;
    --bg-tertiary: #f0f1f3;
    --bg-card: #ffffff;
    --border: #e4e6eb;
    --text-primary: #1a1a2e;
    --text-secondary: #5c5c7a;
    --text-muted: #8c8ca0;
    --accent: #3366ff;
    --accent-hover: #2855dd;
    --user-bubble: #e8f0fe;
    --thinking-bg: #f5f7fa;
    --thinking-border: #dfe3e8;
    --tool-call-bg: #f0f5ff;
    --tool-result-bg: #f0fff0;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --scrollbar: #d1d5db;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部标题栏 */
  #header {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    background: var(--bg-secondary);
  }

  #header-content {
    max-width: 95%;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #header .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #4a7cff, #7c4aff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  #header h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
  }

  #header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* 聊天区域 */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  #chat-container::-webkit-scrollbar { width: 6px; }
  #chat-container::-webkit-scrollbar-track { background: transparent; }
  #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  /* 欢迎提示 */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-muted);
    padding: 40px 24px;
  }

  #welcome .welcome-icon {
    font-size: 48px;
    opacity: 0.5;
  }

  #welcome p {
    font-size: 14px;
    text-align: center;
  }

  /* 消息行 - 全宽背景 */
  .message-row {
    width: 100%;
    padding: 20px 24px;
  }

  .message-row.user {
    background: var(--bg-primary);
  }

  .message-row.assistant {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .message-row + .message-row.assistant {
    border-top: none;
  }

  /* 消息内容容器 - 居中 */
  .message-content-wrapper {
    max-width: 95%;
    margin: 0 auto;
  }

  /* 消息气泡 */
  .message {
    display: flex;
    flex-direction: column;
  }

  .message.user {
    align-items: flex-end;
  }

  .message.assistant {
    align-items: flex-start;
  }

  .message-role {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .user .message-role { text-align: right; }

  .user-bubble {
    background: var(--user-bubble);
    border: 1px solid #2a3d5a;
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    padding: 12px 16px;
    max-width: 80%;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
  }

  .assistant-content {
    width: 100%;
  }

  /* 思考折叠区 */
  details.thinking-panel {
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    overflow: hidden;
  }

  details.thinking-panel summary {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    list-style: none;
  }

  details.thinking-panel summary::-webkit-details-marker { display: none; }

  details.thinking-panel summary::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7cff55, #7c4aff55);
    border: 1px solid #4a7cff88;
    flex-shrink: 0;
  }

  details.thinking-panel summary::after {
    content: '▶';
    margin-left: auto;
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
  }

  details.thinking-panel[open] summary::after {
    transform: rotate(90deg);
  }

  /* 思考中动画 */
  .thinking-dot {
    display: inline-block;
    animation: blink-dot 1.2s infinite;
  }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink-dot {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .thinking-content {
    padding: 4px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 步骤卡片 */
  .step-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
  }

  .step-card .step-header {
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 2px;
    font-size: 12px;
  }

  .step-card .step-body {
    color: var(--text-secondary);
    font-size: 12px;
  }

  /* 状态消息 */
  .status-message {
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.3s ease;
  }

  .status-message .status-icon {
    font-size: 14px;
    color: #3b82f6;
  }

  .status-message .status-text {
    color: var(--text-secondary);
    flex: 1;
  }

  /* 工具调用卡片 */
  .tool-card {
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
    border: 1px solid #2a3545;
  }

  .tool-card .tool-header {
    background: var(--tool-call-bg);
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #6aaeff;
    font-weight: 500;
  }

  .tool-card .tool-header .tool-icon {
    font-size: 11px;
    opacity: 0.8;
  }

  .tool-card .tool-args {
    background: #141a24;
    padding: 8px 12px;
    color: var(--text-muted);
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }

  .tool-card .tool-result-section {
    background: var(--tool-result-bg);
    border-top: 1px solid #1e3020;
    padding: 7px 12px;
    color: #6aaa6a;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }

  .tool-card .tool-result-section .result-label {
    color: #4a8a4a;
    font-weight: 500;
    margin-bottom: 4px;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
  }

  /* 最终回答区 */
  .answer-content {
    color: var(--text-primary);
    line-height: 1.75;
  }

  .answer-content.streaming::after {
    content: '▋';
    display: inline;
    animation: cursor-blink 0.7s step-end infinite;
    color: var(--accent);
    font-size: 0.9em;
    margin-left: 1px;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Markdown 渲染 */
  .answer-content h1, .answer-content h2, .answer-content h3 {
    margin: 1em 0 0.5em;
    color: var(--text-primary);
    font-weight: 600;
  }
  .answer-content h1 { font-size: 1.3em; }
  .answer-content h2 { font-size: 1.15em; }
  .answer-content h3 { font-size: 1.05em; }
  .answer-content p { margin: 0.6em 0; }
  .answer-content ul, .answer-content ol { padding-left: 1.5em; margin: 0.5em 0; }
  .answer-content li { margin: 0.25em 0; }
  .answer-content code {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 0.88em;
    color: #e0a0ff;
  }
  .answer-content pre {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0.7em 0;
  }
  .answer-content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    color: #c0c0e0;
  }
  .answer-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--text-secondary);
    margin: 0.5em 0;
  }
  .answer-content div[style*="overflow-x"] {
    margin: 0.7em 0;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .answer-content table {
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 100%;
  }
  .answer-content th, .answer-content td {
    border: 1px solid var(--border);
    padding: 8px 14px;
    text-align: left;
    white-space: nowrap;
  }
  .answer-content th {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-weight: 500;
  }
  .answer-content tr:nth-child(even) td { background: #15151a; }
  .answer-content strong { color: #d0d0f0; font-weight: 600; }
  .answer-content em { color: var(--text-secondary); }
  .answer-content a { color: var(--accent); text-decoration: none; }
  .answer-content a:hover { text-decoration: underline; }
  /* Excel 下载链接样式 */
  .answer-content a[href*="/downloads/"] {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .answer-content a[href*="/downloads/"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    text-decoration: none;
  }
  .answer-content a[href*="/downloads/"]::before {
    content: "📊";
    font-size: 14px;
  }
  .answer-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* 错误消息 */
  .error-message {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: #ff7070;
    font-size: 13px;
  }

  /* 底部输入区 */
  #input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-secondary);
  }

  .input-wrapper {
    max-width: 95%;
    margin: 0 auto;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: #3a5aaa;
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    line-height: 1.55;
    max-height: 180px;
    min-height: 24px;
  }

  #user-input::placeholder {
    color: var(--text-muted);
  }

  #send-btn {
    width: 34px;
    height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
    color: white;
    font-size: 15px;
  }

  #send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  #send-btn:active:not(:disabled) {
    transform: scale(0.92);
  }

  #send-btn:disabled {
    background: var(--bg-tertiary);
    cursor: not-allowed;
    color: var(--text-muted);
  }

  #stop-btn {
    width: 34px;
    height: 34px;
    background: #e04848;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    transition: background 0.2s, transform 0.1s;
  }

  #stop-btn:hover {
    background: #ff5a5a;
  }

  #stop-btn:active {
    transform: scale(0.92);
  }

  .hint-text {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
  }

  /* 主题切换按钮 */
  .theme-toggle {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    margin-left: auto;
  }

  .theme-toggle:hover {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--accent);
  }

  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }

  :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

  /* 浅色主题硬编码颜色覆盖 */
  :root[data-theme="light"] .user-bubble {
    border-color: #c4d4f0;
  }

  :root[data-theme="light"] .tool-card {
    border-color: #d0d8e8;
  }

  :root[data-theme="light"] .tool-card .tool-args {
    background: #f8fafc;
  }

  :root[data-theme="light"] .tool-card .tool-result-section {
    border-top-color: #d0e8d0;
  }

  :root[data-theme="light"] .answer-content tr:nth-child(even) td {
    background: #f8f8fa;
  }

  :root[data-theme="light"] .answer-content code {
    color: #7c3aed;
  }

  :root[data-theme="light"] .answer-content pre code {
    color: #374151;
  }

  :root[data-theme="light"] .answer-content strong {
    color: #1a1a2e;
  }

  :root[data-theme="light"] .input-wrapper:focus-within {
    border-color: #3366ff;
  }

  :root[data-theme="light"] .status-message {
    background: rgba(59, 130, 246, 0.06);
    border-color: rgba(59, 130, 246, 0.15);
  }

  :root[data-theme="light"] details.thinking-panel summary::before {
    background: linear-gradient(135deg, #3366ff55, #5588ff55);
    border-color: #3366ff88;
  }

  /* 侧边栏 */
  #body-layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease;
  }

  #body-layout.collapsed #sidebar {
    width: 0;
    border-right: none;
  }

  .sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #sidebar-toggle {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    transition: background 0.12s, transform 0.25s ease;
  }

  #sidebar-toggle:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  #body-layout.collapsed #sidebar-toggle {
    transform: rotate(180deg);
  }

  /* 侧边栏折叠后浮出的展开按钮 */
  #sidebar-expand {
    display: none;
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    z-index: 10;
  }

  #body-layout.collapsed #sidebar-expand {
    display: flex;
  }

  #new-conv-btn {
    width: 100%;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }

  #new-conv-btn:hover {
    background: var(--bg-card);
    border-color: var(--accent);
  }

  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  #conv-list::-webkit-scrollbar { width: 4px; }
  #conv-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

  .conv-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    position: relative;
    transition: background 0.12s;
  }

  .conv-item:hover { background: var(--bg-tertiary); }
  .conv-item.active { background: var(--bg-tertiary); border: 1px solid var(--border); }

  .conv-title {
    font-size: 13.5px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 24px;
    line-height: 1.4;
  }

  .conv-item.active .conv-title { font-weight: 500; }

  .conv-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .conv-delete {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.12s, color 0.12s;
  }

  .conv-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: #e04848; background: rgba(224, 72, 72, 0.1); }

  .sidebar-empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  #main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  /* 移动端：隐藏侧边栏 */
  @media (max-width: 768px) {
    #sidebar { display: none; }
  }

  /* 浅色主题侧边栏覆盖 */
  :root[data-theme="light"] .conv-item.active { background: #f0f1f3; }
</style>
</head>

          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
          <button id="stop-btn" title="停止生成 (Esc)" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
// ============================================================
// 主题管理
// ============================================================
const THEME_KEY = 'chat-theme';

function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

function getStoredTheme() {
  return localStorage.getItem(THEME_KEY);
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}

function initTheme() {
  const stored = getStoredTheme();
  if (stored) {
    setTheme(stored);
  } else {
    setTheme(getSystemTheme());
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  setTheme(next);
}

// 监听系统主题变化
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  if (!getStoredTheme()) {
    setTheme(e.matches ? 'dark' : 'light');
  }
});

// 初始化主题
initTheme();

// ============================================================
// 侧边栏折叠
// ============================================================
const SIDEBAR_KEY = 'sidebar-collapsed';

function getSidebarState() {
  return localStorage.getItem(SIDEBAR_KEY) === '1';
}

function setSidebarCollapsed(collapsed) {
  if (collapsed) {
    bodyLayout.classList.add('collapsed');
    sidebarToggle.title = '展开侧边栏';
  } else {
    bodyLayout.classList.remove('collapsed');
    sidebarToggle.title = '折叠侧边栏';
  }
  localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
}

function toggleSidebar() {
  const collapsed = bodyLayout.classList.contains('collapsed');
  setSidebarCollapsed(!collapsed);
}

// ============================================================
// 配置
// ============================================================
// 基础 URL（自动检测当前主机地址）
const BASE_URL = `${window.location.protocol}//${window.location.host}`;

// const API_URL = 'http://localhost:8000/api/v1/chat/stream';

const API_URL = `${BASE_URL}/api/v1/chat/stream`; // 'BASE_URL/api/v1/chat/stream';
// ============================================================
// 状态
// ============================================================
let userId = 'default-user';

let conversationId = null;        // 当前激活的会话ID
let conversations = [];           // 会话列表缓存
let conversationHistory = [];     // 当前会话的消息（仅用于渲染）
let isStreaming = false;
let abortController = null;

// ============================================================
// DOM 引用
// ============================================================
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const sidebarToggle = document.getElementById('sidebar-toggle');
const sidebarExpand = document.getElementById('sidebar-expand');
const bodyLayout = document.getElementById('body-layout');
const welcome = document.getElementById('welcome');

// 初始化侧边栏状态
if (getSidebarState()) {
  setSidebarCollapsed(true);
}

sidebarToggle.addEventListener('click', toggleSidebar);
sidebarExpand.addEventListener('click', toggleSidebar);

// ============================================================
// Markdown 渲染（使用 marked.js）
// ============================================================

// 自定义渲染器：处理下载链接
const renderer = new marked.Renderer();
renderer.link = function({ href, title, text }) {
  // 调试日志
  console.log('[marked.link] raw href:', href, 'text:', text);

  // 处理 href 可能是对象或其他类型的情况
  let hrefStr = '';
  if (typeof href === 'string') {
    hrefStr = href;
  } else if (href && typeof href.href === 'string') {
    // 处理嵌套对象情况
    hrefStr = href.href;
  } else {
    hrefStr = String(href || '');
  }

  // 处理 text 可能是 Token 对象的情况
  let textStr = '';
  if (typeof text === 'string') {
    textStr = text;
  } else if (text && typeof text.text === 'string') {
    textStr = text.text;
  } else {
    textStr = String(text || '');
  }

  // 检测是否为下载链接（包含 /downloads/）
  const isExport = hrefStr.includes('/downloads/');
  // 如果是相对路径，转为完整 URL；否则保持原样
  const fullHref = (isExport && hrefStr.startsWith('/downloads/')) ? BASE_URL + hrefStr : hrefStr;
  const downloadAttr = isExport ? ' download' : '';
  const titleAttr = title ? ` title="${title}"` : '';

  return `<a href="${fullHref}" target="_blank" rel="noopener"${downloadAttr}${titleAttr}>${textStr}</a>`;
};

// 配置 marked
marked.setOptions({
  gfm: true,           // 启用 GitHub Flavored Markdown
  tables: true,        // 启用表格
  breaks: false,       // 不自动转换换行为 <br>
  pedantic: false,     // 不使用严格模式
  sanitize: false,     // 不启用 sanitize
  smartLists: true,    // 智能列表
  smartypants: true,   // 智能标点
  renderer: renderer   // 使用自定义渲染器
});

/** 渲染 Markdown（使用 marked.js） */
function renderMarkdown(text) {
  return marked.parse(text);
}

/** 内联样式：粗体/斜体/行内代码/链接（用于工具卡片等简单场景） */
function renderInline(text) {
  return text
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>')
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, p1, p2) => {
      // 下载链接：检测是否包含 /downloads/，添加 download 属性
      let href = p2;
      let isExport = href.includes('/downloads/');
      // 如果是相对路径，转为完整 URL
      if (isExport && href.startsWith('/downloads/')) {
        href = BASE_URL + href;
      }
      let downloadAttr = isExport ? ' download' : '';
      return `<a href="${href}" target="_blank" rel="noopener"${downloadAttr}>${p1}</a>`;
    });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// 创建消息 DOM
// ============================================================
function appendUserMessage(text) {
  if (welcome) welcome.style.display = 'none';

  const row = document.createElement('div');
  row.className = 'message-row user';

  const wrapper = document.createElement('div');
  wrapper.className = 'message-content-wrapper';

  const msg = document.createElement('div');
  msg.className = 'message user';
  msg.innerHTML = `
    <div class="message-role">您</div>
    <div class="user-bubble">${escapeHtml(text)}</div>
  `;

  wrapper.appendChild(msg);
  row.appendChild(wrapper);
  chatContainer.appendChild(row);
  scrollToBottom();
  return row;
}

function createAssistantMessage() {
  const row = document.createElement('div');
  row.className = 'message-row assistant';

  const wrapper = document.createElement('div');
  wrapper.className = 'message-content-wrapper';

  const msg = document.createElement('div');
  msg.className = 'message assistant';

  // 思考折叠区
  const details = document.createElement('details');
  details.className = 'thinking-panel';
  details.open = true; // 默认展开，流式过程中展示

  const summary = document.createElement('summary');
  summary.innerHTML = `<span class="thinking-label">思考中<span class="thinking-dot">.</span><span class="thinking-dot">.</span><span class="thinking-dot">.</span></span>`;
  details.appendChild(summary);

  const thinkingContent = document.createElement('div');
  thinkingContent.className = 'thinking-content';
  details.appendChild(thinkingContent);

  // 最终回答区
  const answerContent = document.createElement('div');
  answerContent.className = 'answer-content assistant-content';

  msg.innerHTML = `<div class="message-role">能效智能体</div>`;
  msg.appendChild(details);
  msg.appendChild(answerContent);

  wrapper.appendChild(msg);
  row.appendChild(wrapper);
  chatContainer.appendChild(row);
  scrollToBottom();

  return { div: row, details, summary, thinkingContent, answerContent };
}

// ============================================================
// 辅助工具
// ============================================================
function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 使用 requestAnimationFrame 节流：每帧最多执行一次滚动，避免高频 token 期间反复强制 layout
let _scrollPending = false;
function scrollToBottom() {
  if (_scrollPending) return;
  _scrollPending = true;
  requestAnimationFrame(() => {
    chatContainer.scrollTop = chatContainer.scrollHeight;
    _scrollPending = false;
  });
}

function formatJson(obj) {
  try {
    return JSON.stringify(obj, null, 2);
  } catch {
    return String(obj);
  }
}

// 工具调用卡片（存储到 map 供 tool_result 更新）
const toolCardMap = new Map(); // key: tool name + call_id

// 状态消息
function appendStatusMessage(thinkingContent, message) {
  const statusDiv = document.createElement('div');
  statusDiv.className = 'status-message';
  statusDiv.innerHTML = `
    <div class="status-icon">⏳</div>
    <div class="status-text">${escapeHtml(message)}</div>
  `;
  thinkingContent.appendChild(statusDiv);
  scrollToBottom();
}

function appendToolCall(thinkingContent, data) {
  const toolName = data.tool || data.tool_name || '未知工具';
  const args = data.args || data.arguments || data.input || {};
  const callId = data.call_id || data.id || toolName + '_' + Date.now();

  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-header">
      <span class="tool-icon">⚙</span>
      <span>调用工具: <strong>${escapeHtml(toolName)}</strong></span>
    </div>
    <div class="tool-args">${escapeHtml(formatJson(args))}</div>
  `;
  thinkingContent.appendChild(card);
  toolCardMap.set(callId, { card, toolName });
  scrollToBottom();
  return { card, callId };
}

function appendToolResult(thinkingContent, data) {
  const toolName = data.tool || data.tool_name || '';
  const result = data.result || data.output || data.content || data;
  const callId = data.call_id || data.id || toolName;

  // 尝试找对应的工具调用卡片
  let card = null;
  if (toolCardMap.has(callId)) {
    card = toolCardMap.get(callId).card;
  } else {
    // 找名称匹配的最后一个
    for (const [key, val] of toolCardMap) {
      if (val.toolName === toolName) card = val.card;
    }
  }

  const resultSection = document.createElement('div');
  resultSection.className = 'tool-result-section';
  resultSection.innerHTML = `
    <div class="result-label">↩ 返回结果</div>
    ${escapeHtml(typeof result === 'object' ? formatJson(result) : String(result))}
  `;

  if (card) {
    card.appendChild(resultSection);
  } else {
    // 没有对应卡片，单独展示
    const fallback = document.createElement('div');
    fallback.className = 'tool-card';
    fallback.innerHTML = `
      <div class="tool-header"><span class="tool-icon">↩</span> 工具结果: ${escapeHtml(toolName)}</div>
    `;
    fallback.appendChild(resultSection);
    thinkingContent.appendChild(fallback);
  }
  scrollToBottom();
}

// ============================================================
// 会话管理
// ============================================================
async function loadConversationList() {
  try {
    const resp = await fetch(`${BASE_URL}/api/v1/conversations?user_id=${encodeURIComponent(userId)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    conversations = data.conversations || [];
    renderConversationList();
  } catch (err) {
    console.error('[loadConversationList]', err);
  }
}

function renderConversationList() {
  const list = document.getElementById('conv-list');
  if (!conversations.length) {
    list.innerHTML = '<div class="sidebar-empty">暂无对话记录</div>';
    return;
  }
  list.innerHTML = conversations.map(c => {
    const dateStr = c.updated_at ? new Date(c.updated_at).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) : '';
    const activeClass = c.conversation_id === conversationId ? ' active' : '';
    return `
      <div class="conv-item${activeClass}" data-cid="${c.conversation_id}" onclick="switchConversation('${c.conversation_id}')">
        <div class="conv-title">${escapeHtml(c.title || '新对话')}</div>
        <div class="conv-date">${dateStr}</div>
        <button class="conv-delete" title="删除" onclick="event.stopPropagation(); deleteConversation('${c.conversation_id}')">&times;</button>
      </div>`;
  }).join('');
}

async function switchConversation(cid) {
  if (isStreaming) { abortController?.abort(); }
  conversationId = cid;
  try {
    const resp = await fetch(`${BASE_URL}/api/v1/conversations/${cid}`);
    if (!resp.ok) throw new Error('加载失败');
    const data = await resp.json();
    conversationHistory = data.messages || [];

    // 清空并重新渲染
    const cc = document.getElementById('chat-container');
    cc.innerHTML = '';
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.style.display = 'none';

    conversationHistory.forEach(msg => {
      if (msg.role === 'user') {
        appendUserMessage(msg.content);
      } else if (msg.role === 'assistant') {
        renderHistoryAssistant(msg.content);
      }
    });
    scrollToBottom();
  } catch (err) {
    console.error('[switchConversation]', err);
    newConversation();
    return;
  }
  renderConversationList();
}

function renderHistoryAssistant(content) {
  const row = document.createElement('div');
  row.className = 'message-row assistant';
  const wrapper = document.createElement('div');
  wrapper.className = 'message-content-wrapper';
  const msg = document.createElement('div');
  msg.className = 'message assistant';
  const answerContent = document.createElement('div');
  answerContent.className = 'answer-content assistant-content';
  answerContent.innerHTML = renderMarkdown(content || '');
  msg.innerHTML = '<div class="message-role">能效智能体</div>';
  msg.appendChild(answerContent);
  wrapper.appendChild(msg);
  row.appendChild(wrapper);
  document.getElementById('chat-container').appendChild(row);
}

function newConversation() {
  if (isStreaming) { abortController?.abort(); }
  conversationId = null;
  conversationHistory = [];
  const cc = document.getElementById('chat-container');
  cc.innerHTML = `
    <div id="welcome">
      <div class="welcome-icon">⚡</div>
      <p>您好，我是能效智能体，请问有什么可以帮助您？</p>
    </div>`;
  loadConversationList();
}

async function deleteConversation(cid) {
  const isCurrent = cid === conversationId;
  try {
    await fetch(`${BASE_URL}/api/v1/conversations/${cid}`, { method: 'DELETE' });
  } catch (err) {
    console.error('[deleteConversation]', err);
  }
  if (isCurrent) {
    newConversation();
  }
  await loadConversationList();
}

// ============================================================
// 核心：流式请求
// ============================================================

/**
 * 解析并分发单条 SSE 事件文本块
 * 修复点：提取为独立函数，供流中和流结束后的残余 buffer 复用
 */
function processSseEvent(eventStr, ctx) {
  const { thinkingContent, summary, details, answerContent } = ctx;

  // 按行解析，兼容 \r\n 和 \n
  let eventType = '';
  let dataStr = '';
  for (const rawLine of eventStr.split('\n')) {
    const line = rawLine.replace(/\r$/, ''); // 去掉 Windows \r
    if (line.startsWith('event:')) {
      eventType = line.slice(6).trim();
    } else if (line.startsWith('data:')) {
      dataStr = line.slice(5).trim();
    }
    // 忽略注释行（: ping ...）和空行
  }

  if (!dataStr || dataStr === '[DONE]') return;

  // 解析 JSON
  let data;
  try {
    data = JSON.parse(dataStr);
  } catch {
    console.warn('[SSE] JSON 解析失败:', dataStr.slice(0, 80));
    return;
  }

  // 解包后端嵌套格式 {"event_type": "...", "data": ...}
  const payload = (data !== null && typeof data === 'object' && 'data' in data)
    ? data.data
    : data;

  // 如果没有 event: 行，则用 JSON 里的 event_type 字段作为 fallback
  if (!eventType && data && data.event_type) {
    eventType = data.event_type;
  }

  console.log('[SSE]', eventType, typeof payload === 'string' ? payload.slice(0, 60) : payload);

  switch (eventType) {
    case 'status': {
      const statusMsg = typeof payload === 'object' ? payload.message || payload.status : String(payload);
      if (statusMsg) {
        appendStatusMessage(thinkingContent, statusMsg);
      }
      break;
    }
    case 'token': {
      const token = typeof payload === 'object' ? payload.token : String(payload);
      if (token) {
        if (ctx.hasThinking) {
          // 工具调用后的总结 token → 直接流到回答区
          ctx.finalAnswerText += token;
          answerContent.textContent = ctx.finalAnswerText;
          answerContent.classList.add('streaming');
        } else {
          // 意图识别阶段的 token → 思考面板
          ctx.streamingText += token;
          if (!ctx.streamingDiv) {
            ctx.streamingDiv = document.createElement('div');
            ctx.streamingDiv.className = 'step-card';
            ctx.streamingDiv.innerHTML = '<div class="step-header">推理中</div><div class="step-body"></div>';
            thinkingContent.appendChild(ctx.streamingDiv);
            details.open = true;
          }
          ctx.streamingDiv.querySelector('.step-body').textContent = ctx.streamingText;
          summary.innerHTML = '思考中<span class="thinking-dot">.</span><span class="thinking-dot">.</span><span class="thinking-dot">.</span></span>';
        }
        scrollToBottom();
      }
      break;
    }
    case 'tool_call': {
      // 移除流式推理文本（LLM 已确定工具调用，原始文本失去意义）
      if (ctx.streamingDiv) {
        ctx.streamingDiv.remove();
        ctx.streamingDiv = null;
        ctx.streamingText = '';
      }
      ctx.hasThinking = true;
      const tcData = typeof payload === 'object' ? payload : { tool: String(payload) };
      ctx.toolCalls.push({
        id: tcData.call_id || `call_${ctx.toolCalls.length}`,
        name: tcData.tool || 'unknown',
        args: tcData.args || {}
      });
      appendToolCall(thinkingContent, tcData);
      break;
    }
    case 'tool_result': {
      ctx.hasThinking = true;
      const trData = typeof payload === 'object' ? payload : { result: String(payload) };
      ctx.toolResults.push({ id: trData.call_id || '', result: trData });
      appendToolResult(thinkingContent, trData);
      break;
    }
    case 'conversation': {
      const cid = typeof payload === 'object' ? payload.conversation_id : payload;
      if (cid) {
        conversationId = cid;
        renderConversationList();
      }
      break;
    }
    case 'agent_step': {
      const step = typeof payload === 'object' ? payload.step : payload;
      ctx.stepCount = step;
      break;
    }
    case 'final_answer': {
      // 始终用 final_answer 的完整数据覆盖，防止 token 流中途丢失导致显示不完整
      if (payload) {
        ctx.finalAnswerText = String(payload);
      }
      // 完整 Markdown 渲染到回答区
      answerContent.innerHTML = renderMarkdown(ctx.finalAnswerText);
      answerContent.classList.remove('streaming');
      if (ctx.hasThinking) {
        summary.innerHTML = `已完成推理（${ctx.toolCalls.length} 步）`;
        details.open = false;
      } else {
        // 无工具调用：清理思考面板中的流式文本，折叠面板
        if (ctx.streamingDiv) {
          ctx.streamingDiv.remove();
          ctx.streamingDiv = null;
        }
        details.style.display = 'none';
      }
      scrollToBottom();
      break;
    }
    case 'error': {
      const errMsg = typeof payload === 'string' ? payload : formatJson(payload);
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = '错误：' + errMsg;
      answerContent.appendChild(errDiv);
      details.style.display = 'none';
      break;
    }
  }
}

async function streamChat(userMessage) {
  if (isStreaming) return;
  isStreaming = true;
  abortController = new AbortController();
  sendBtn.style.display = 'none';
  stopBtn.style.display = '';
  toolCardMap.clear();

  const isNewConv = !conversationId;
  appendUserMessage(userMessage);

  const { details, summary, thinkingContent, answerContent } = createAssistantMessage();

  const ctx = {
    finalAnswerText: '',
    hasThinking: false,
    thinkingContent,
    summary,
    details,
    answerContent,
    toolCalls: [],
    toolResults: [],
    streamingText: '',
    streamingDiv: null,
  };

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: userMessage,
        conversation_id: conversationId,
        user_id: userId,
      }),
      signal: abortController.signal,
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();

      if (value) {
        buffer += decoder.decode(value, { stream: true });
      }

      // 按 \r\n\r\n 或 \n\n 切割完整事件（sse-starlette 使用 \r\n\r\n），不完整的留在 buffer
      const parts = buffer.split(/\r?\n\r?\n/);

      if (done) {
        // 流已结束：所有 parts 都处理（包括最后一个可能不含 \n\n 的残余）
        for (const eventStr of parts) {
          if (eventStr.trim()) processSseEvent(eventStr, ctx);
        }
        break;
      } else {
        // 流未结束：最后一段可能不完整，留待下次
        buffer = parts.pop() || '';
        for (const eventStr of parts) {
          if (eventStr.trim()) processSseEvent(eventStr, ctx);
        }
      }
    }

    // 流结束后兜底
    if (!ctx.finalAnswerText) {
      if (ctx.hasThinking) {
        summary.innerHTML = `已完成推理（${ctx.toolCalls.length} 步）`;
        details.open = false;
      } else {
        details.style.display = 'none';
      }
      answerContent.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">（未收到回答内容）</p>';
    }

    // 新会话：首条消息后刷新侧边栏
    if (isNewConv && conversationId) {
      await loadConversationList();
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      if (ctx.hasThinking) {
        summary.innerHTML = `已停止（${ctx.stepCount || 1} 步）`;
        details.open = false;
      }
      if (!answerContent.innerHTML.trim()) {
        answerContent.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">（已停止生成）</p>';
      }
    } else {
      console.error('[streamChat error]', err);
      answerContent.innerHTML = `<div class="error-message">连接失败：${escapeHtml(err.message)}</div>`;
      details.style.display = 'none';
      summary.innerHTML = '请求失败';
    }
  } finally {
    isStreaming = false;
    abortController = null;
    sendBtn.style.display = '';
    stopBtn.style.display = 'none';
    userInput.focus();
    scrollToBottom();
  }
}

// ============================================================
// 输入框自适应高度
// ============================================================
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
});

// ============================================================
// 事件绑定
// ============================================================
function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;
  if (isStreaming) {
    // 正在流式输出中：先停止再发送新消息
    abortController?.abort();
    // 延迟发送，等当前流完全终止
    setTimeout(() => {
      userInput.value = text;
      handleSend();
    }, 200);
    return;
  }
  userInput.value = '';
  userInput.style.height = 'auto';
  streamChat(text);
}

sendBtn.addEventListener('click', handleSend);

stopBtn.addEventListener('click', () => {
  abortController?.abort();
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
  if (e.key === 'Escape' && isStreaming) {
    e.preventDefault();
    abortController?.abort();
  }
});

// 页面加载后聚焦输入框
userInput.focus();

// 新对话按钮
document.getElementById('new-conv-btn').addEventListener('click', newConversation);

// 绑定主题切换按钮
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

// 页面加载时获取会话列表
loadConversationList();
</script>
