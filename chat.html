<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节电智能体</title>
<style>
  :root {
    --bg-primary: #0f0f10;
    --bg-secondary: #1a1a1e;
    --bg-tertiary: #252529;
    --bg-card: #1e1e22;
    --border: #2e2e35;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a0;
    --text-muted: #555565;
    --accent: #4a7cff;
    --accent-hover: #6b96ff;
    --user-bubble: #1e2d4a;
    --thinking-bg: #171720;
    --thinking-border: #2a2a3a;
    --tool-call-bg: #1a2030;
    --tool-result-bg: #1a2a1a;
    --error-bg: #2a1a1a;
    --error-border: #5a2020;
    --scrollbar: #2e2e38;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #app {
    width: 100%;
    max-width: 820px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 顶部标题栏 */
  #header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #header .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #4a7cff, #7c4aff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  #header h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
  }

  #header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* 聊天区域 */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    scroll-behavior: smooth;
  }

  #chat-container::-webkit-scrollbar { width: 5px; }
  #chat-container::-webkit-scrollbar-track { background: transparent; }
  #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  /* 欢迎提示 */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-muted);
  }

  #welcome .welcome-icon {
    font-size: 48px;
    opacity: 0.5;
  }

  #welcome p {
    font-size: 14px;
  }

  /* 消息气泡 */
  .message {
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
  }

  .message.user {
    align-items: flex-end;
  }

  .message.assistant {
    align-items: flex-start;
  }

  .message-role {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .user .message-role { text-align: right; }

  .user-bubble {
    background: var(--user-bubble);
    border: 1px solid #2a3d5a;
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    padding: 12px 16px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.65;
  }

  .assistant-content {
    max-width: 100%;
    width: 100%;
  }

  /* 思考折叠区 */
  details.thinking-panel {
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    overflow: hidden;
  }

  details.thinking-panel summary {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    list-style: none;
  }

  details.thinking-panel summary::-webkit-details-marker { display: none; }

  details.thinking-panel summary::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7cff55, #7c4aff55);
    border: 1px solid #4a7cff88;
    flex-shrink: 0;
  }

  details.thinking-panel summary::after {
    content: '▶';
    margin-left: auto;
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
  }

  details.thinking-panel[open] summary::after {
    transform: rotate(90deg);
  }

  /* 思考中动画 */
  .thinking-dot {
    display: inline-block;
    animation: blink-dot 1.2s infinite;
  }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink-dot {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .thinking-content {
    padding: 4px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 步骤卡片 */
  .step-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
  }

  .step-card .step-header {
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 2px;
    font-size: 12px;
  }

  .step-card .step-body {
    color: var(--text-secondary);
    font-size: 12px;
  }

  /* 状态消息 */
  .status-message {
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.3s ease;
  }

  .status-message .status-icon {
    font-size: 14px;
    color: #3b82f6;
  }

  .status-message .status-text {
    color: var(--text-secondary);
    flex: 1;
  }

  /* 工具调用卡片 */
  .tool-card {
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
    border: 1px solid #2a3545;
  }

  .tool-card .tool-header {
    background: var(--tool-call-bg);
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #6aaeff;
    font-weight: 500;
  }

  .tool-card .tool-header .tool-icon {
    font-size: 11px;
    opacity: 0.8;
  }

  .tool-card .tool-args {
    background: #141a24;
    padding: 8px 12px;
    color: var(--text-muted);
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }

  .tool-card .tool-result-section {
    background: var(--tool-result-bg);
    border-top: 1px solid #1e3020;
    padding: 7px 12px;
    color: #6aaa6a;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }

  .tool-card .tool-result-section .result-label {
    color: #4a8a4a;
    font-weight: 500;
    margin-bottom: 4px;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
  }

  /* 最终回答区 */
  .answer-content {
    color: var(--text-primary);
    line-height: 1.75;
  }

  .answer-content.streaming::after {
    content: '▋';
    display: inline;
    animation: cursor-blink 0.7s step-end infinite;
    color: var(--accent);
    font-size: 0.9em;
    margin-left: 1px;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Markdown 渲染 */
  .answer-content h1, .answer-content h2, .answer-content h3 {
    margin: 1em 0 0.5em;
    color: var(--text-primary);
    font-weight: 600;
  }
  .answer-content h1 { font-size: 1.3em; }
  .answer-content h2 { font-size: 1.15em; }
  .answer-content h3 { font-size: 1.05em; }
  .answer-content p { margin: 0.6em 0; }
  .answer-content ul, .answer-content ol { padding-left: 1.5em; margin: 0.5em 0; }
  .answer-content li { margin: 0.25em 0; }
  .answer-content code {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 0.88em;
    color: #e0a0ff;
  }
  .answer-content pre {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0.7em 0;
  }
  .answer-content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    color: #c0c0e0;
  }
  .answer-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--text-secondary);
    margin: 0.5em 0;
  }
  .answer-content div[style*="overflow-x"] {
    margin: 0.7em 0;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .answer-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 400px;
  }
  .answer-content th, .answer-content td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: left;
  }
  .answer-content th {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-weight: 500;
  }
  .answer-content tr:nth-child(even) td { background: #15151a; }
  .answer-content strong { color: #d0d0f0; font-weight: 600; }
  .answer-content em { color: var(--text-secondary); }
  .answer-content a { color: var(--accent); text-decoration: none; }
  .answer-content a:hover { text-decoration: underline; }
  .answer-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* 错误消息 */
  .error-message {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: #ff7070;
    font-size: 13px;
  }

  /* 底部输入区 */
  #input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrapper {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: #3a5aaa;
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    line-height: 1.55;
    max-height: 180px;
    min-height: 24px;
  }

  #user-input::placeholder {
    color: var(--text-muted);
  }

  #send-btn {
    width: 34px;
    height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
    color: white;
    font-size: 15px;
  }

  #send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  #send-btn:active:not(:disabled) {
    transform: scale(0.92);
  }

  #send-btn:disabled {
    background: var(--bg-tertiary);
    cursor: not-allowed;
    color: var(--text-muted);
  }

  .hint-text {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo">⚡</div>
    <h1>节电智能体</h1>
    <span class="subtitle">Energy Agent v5</span>
  </div>

  <div id="chat-container">
    <div id="welcome">
      <div class="welcome-icon">⚡</div>
      <p>您好，我是节电智能体，请问有什么可以帮助您？</p>
    </div>
  </div>

  <div id="input-area">
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="输入问题... (Shift+Enter 换行，Enter 发送)" rows="1"></textarea>
      <button id="send-btn" title="发送 (Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="hint-text">连接至 http://localhost:8000</p>
  </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const API_URL = 'http://localhost:8000/api/v1/chat/stream';

// ============================================================
// 状态
// ============================================================
const conversationHistory = [];
let isStreaming = false;

// ============================================================
// DOM 引用
// ============================================================
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome');

// ============================================================
// Markdown 渲染（块级优先，支持表格）
// ============================================================

/** 内联样式：粗体/斜体/行内代码/链接 */
function renderInline(text) {
  return text
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>')
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/** 判断是否是表格分隔行：|---|:---:|---| */
function isTableSep(line) {
  return /^\|[\s\-:|]+\|/.test(line.trim());
}

/** 判断是否是表格行 */
function isTableRow(line) {
  return line.trim().startsWith('|') && line.trim().endsWith('|');
}

/** 解析一行表格单元格 */
function parseTableRow(line) {
  return line.trim().slice(1, -1).split('|').map(c => c.trim());
}

/** 渲染一个表格块（含表头、分隔行、数据行） */
function renderTable(lines) {
  if (lines.length < 2) return lines.map(l => `<p>${renderInline(esc(l))}</p>`).join('');

  let html = '<div style="overflow-x:auto"><table>';
  let inBody = false;

  for (let i = 0; i < lines.length; i++) {
    if (isTableSep(lines[i])) {
      // 分隔行：上一行是表头，之后进入 tbody
      if (!inBody) {
        html += '</thead><tbody>';
        inBody = true;
      }
      continue;
    }
    const cells = parseTableRow(lines[i]);
    if (!inBody) {
      if (i === 0) html += '<thead>';
      const tag = (!inBody && i === 0) ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag}>${renderInline(esc(c))}</${tag}>`).join('') + '</tr>';
    } else {
      html += '<tr>' + cells.map(c => `<td>${renderInline(esc(c))}</td>`).join('') + '</tr>';
    }
  }

  html += inBody ? '</tbody></table></div>' : '</table></div>';
  return html;
}

function renderMarkdown(text) {
  // 统一换行符
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const blocks = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // —— 代码块 ——
    if (line.startsWith('```')) {
      const lang = line.slice(3).trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) {
        codeLines.push(lines[i]);
        i++;
      }
      i++; // 跳过结尾 ```
      blocks.push(`<pre><code class="lang-${esc(lang)}">${esc(codeLines.join('\n'))}</code></pre>`);
      continue;
    }

    // —— 表格（连续的表格行作为一个块） ——
    if (isTableRow(line)) {
      const tableLines = [];
      while (i < lines.length && (isTableRow(lines[i]) || isTableSep(lines[i]))) {
        tableLines.push(lines[i]);
        i++;
      }
      blocks.push(renderTable(tableLines));
      continue;
    }

    // —— 标题 ——
    const hMatch = line.match(/^(#{1,3})\s+(.+)$/);
    if (hMatch) {
      const level = hMatch[1].length;
      blocks.push(`<h${level}>${renderInline(esc(hMatch[2]))}</h${level}>`);
      i++;
      continue;
    }

    // —— 水平线 ——
    if (/^---+$/.test(line.trim())) {
      blocks.push('<hr>');
      i++;
      continue;
    }

    // —— 引用块 ——
    if (line.startsWith('> ')) {
      const quoteLines = [];
      while (i < lines.length && lines[i].startsWith('> ')) {
        quoteLines.push(lines[i].slice(2));
        i++;
      }
      blocks.push(`<blockquote>${renderInline(esc(quoteLines.join(' ')))}</blockquote>`);
      continue;
    }

    // —— 无序列表 ——
    if (/^[-*+] /.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*+] /.test(lines[i])) {
        items.push(`<li>${renderInline(esc(lines[i].replace(/^[-*+] /, '')))}</li>`);
        i++;
      }
      blocks.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    // —— 有序列表 ——
    if (/^\d+\. /.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) {
        items.push(`<li>${renderInline(esc(lines[i].replace(/^\d+\. /, '')))}</li>`);
        i++;
      }
      blocks.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    // —— 空行：段落分隔符，忽略 ——
    if (line.trim() === '') {
      i++;
      continue;
    }

    // —— 普通段落（连续非空行合并） ——
    const paraLines = [];
    while (i < lines.length && lines[i].trim() !== '' &&
           !lines[i].startsWith('```') && !isTableRow(lines[i]) &&
           !lines[i].match(/^#{1,3} /) && !/^---+$/.test(lines[i].trim()) &&
           !lines[i].startsWith('> ') && !/^[-*+] /.test(lines[i]) &&
           !/^\d+\. /.test(lines[i])) {
      paraLines.push(lines[i]);
      i++;
    }
    if (paraLines.length) {
      blocks.push(`<p>${renderInline(esc(paraLines.join('<br>')))}</p>`);
    }
  }

  return blocks.join('\n');
}

// ============================================================
// 创建消息 DOM
// ============================================================
function appendUserMessage(text) {
  if (welcome) welcome.style.display = 'none';

  const div = document.createElement('div');
  div.className = 'message user';
  div.innerHTML = `
    <div class="message-role">您</div>
    <div class="user-bubble">${escapeHtml(text)}</div>
  `;
  chatContainer.appendChild(div);
  scrollToBottom();
  return div;
}

function createAssistantMessage() {
  const div = document.createElement('div');
  div.className = 'message assistant';

  // 思考折叠区
  const details = document.createElement('details');
  details.className = 'thinking-panel';
  details.open = true; // 默认展开，流式过程中展示

  const summary = document.createElement('summary');
  summary.innerHTML = `<span class="thinking-label">思考中<span class="thinking-dot">.</span><span class="thinking-dot">.</span><span class="thinking-dot">.</span></span>`;
  details.appendChild(summary);

  const thinkingContent = document.createElement('div');
  thinkingContent.className = 'thinking-content';
  details.appendChild(thinkingContent);

  // 最终回答区
  const answerContent = document.createElement('div');
  answerContent.className = 'answer-content assistant-content';

  div.innerHTML = `<div class="message-role">节电智能体</div>`;
  div.appendChild(details);
  div.appendChild(answerContent);

  chatContainer.appendChild(div);
  scrollToBottom();

  return { div, details, summary, thinkingContent, answerContent };
}

// ============================================================
// 辅助工具
// ============================================================
function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 使用 requestAnimationFrame 节流：每帧最多执行一次滚动，避免高频 token 期间反复强制 layout
let _scrollPending = false;
function scrollToBottom() {
  if (_scrollPending) return;
  _scrollPending = true;
  requestAnimationFrame(() => {
    chatContainer.scrollTop = chatContainer.scrollHeight;
    _scrollPending = false;
  });
}

function formatJson(obj) {
  try {
    return JSON.stringify(obj, null, 2);
  } catch {
    return String(obj);
  }
}

// 工具调用卡片（存储到 map 供 tool_result 更新）
const toolCardMap = new Map(); // key: tool name + call_id

// 状态消息
function appendStatusMessage(thinkingContent, message) {
  const statusDiv = document.createElement('div');
  statusDiv.className = 'status-message';
  statusDiv.innerHTML = `
    <div class="status-icon">⏳</div>
    <div class="status-text">${escapeHtml(message)}</div>
  `;
  thinkingContent.appendChild(statusDiv);
  scrollToBottom();
}

function appendToolCall(thinkingContent, data) {
  const toolName = data.tool || data.tool_name || '未知工具';
  const args = data.args || data.arguments || data.input || {};
  const callId = data.call_id || data.id || toolName + '_' + Date.now();

  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-header">
      <span class="tool-icon">⚙</span>
      <span>调用工具: <strong>${escapeHtml(toolName)}</strong></span>
    </div>
    <div class="tool-args">${escapeHtml(formatJson(args))}</div>
  `;
  thinkingContent.appendChild(card);
  toolCardMap.set(callId, { card, toolName });
  scrollToBottom();
  return { card, callId };
}

function appendToolResult(thinkingContent, data) {
  const toolName = data.tool || data.tool_name || '';
  const result = data.result || data.output || data.content || data;
  const callId = data.call_id || data.id || toolName;

  // 尝试找对应的工具调用卡片
  let card = null;
  if (toolCardMap.has(callId)) {
    card = toolCardMap.get(callId).card;
  } else {
    // 找名称匹配的最后一个
    for (const [key, val] of toolCardMap) {
      if (val.toolName === toolName) card = val.card;
    }
  }

  const resultSection = document.createElement('div');
  resultSection.className = 'tool-result-section';
  resultSection.innerHTML = `
    <div class="result-label">↩ 返回结果</div>
    ${escapeHtml(typeof result === 'object' ? formatJson(result) : String(result))}
  `;

  if (card) {
    card.appendChild(resultSection);
  } else {
    // 没有对应卡片，单独展示
    const fallback = document.createElement('div');
    fallback.className = 'tool-card';
    fallback.innerHTML = `
      <div class="tool-header"><span class="tool-icon">↩</span> 工具结果: ${escapeHtml(toolName)}</div>
    `;
    fallback.appendChild(resultSection);
    thinkingContent.appendChild(fallback);
  }
  scrollToBottom();
}

// ============================================================
// 核心：流式请求
// ============================================================

/**
 * 解析并分发单条 SSE 事件文本块
 * 修复点：提取为独立函数，供流中和流结束后的残余 buffer 复用
 */
function processSseEvent(eventStr, ctx) {
  const { thinkingContent, summary, details, answerContent } = ctx;

  // 按行解析，兼容 \r\n 和 \n
  let eventType = '';
  let dataStr = '';
  for (const rawLine of eventStr.split('\n')) {
    const line = rawLine.replace(/\r$/, ''); // 去掉 Windows \r
    if (line.startsWith('event:')) {
      eventType = line.slice(6).trim();
    } else if (line.startsWith('data:')) {
      dataStr = line.slice(5).trim();
    }
    // 忽略注释行（: ping ...）和空行
  }

  if (!dataStr || dataStr === '[DONE]') return;

  // 解析 JSON
  let data;
  try {
    data = JSON.parse(dataStr);
  } catch {
    console.warn('[SSE] JSON 解析失败:', dataStr.slice(0, 80));
    return;
  }

  // 解包后端嵌套格式 {"event_type": "...", "data": ...}
  const payload = (data !== null && typeof data === 'object' && 'data' in data)
    ? data.data
    : data;

  // 如果没有 event: 行，则用 JSON 里的 event_type 字段作为 fallback
  if (!eventType && data && data.event_type) {
    eventType = data.event_type;
  }

  console.log('[SSE]', eventType, typeof payload === 'string' ? payload.slice(0, 60) : payload);

  switch (eventType) {
    case 'status': {
      const statusMsg = typeof payload === 'object' ? payload.message || payload.status : String(payload);
      if (statusMsg) {
        appendStatusMessage(thinkingContent, statusMsg);
      }
      break;
    }
    case 'token': {
      const token = typeof payload === 'object' ? payload.token : String(payload);
      if (token) {
        ctx.finalAnswerText += token;
        // 流式期间：直接追加纯文本，避免每 token 重渲全文 Markdown（大报告会导致浏览器崩溃）
        answerContent.textContent = ctx.finalAnswerText;
        answerContent.classList.add('streaming');
        scrollToBottom();
      }
      break;
    }
    case 'tool_call': {
      ctx.hasThinking = true;
      appendToolCall(thinkingContent, typeof payload === 'object' ? payload : { tool: String(payload) });
      break;
    }
    case 'tool_result': {
      ctx.hasThinking = true;
      appendToolResult(thinkingContent, typeof payload === 'object' ? payload : { result: String(payload) });
      break;
    }
    case 'agent_step': {
      const step = typeof payload === 'object' ? payload.step : payload;
      ctx.stepCount = step;
      break;
    }
    case 'final_answer': {
      // 始终用 final_answer 的完整数据覆盖，防止 token 流中途丢失导致显示不完整
      if (payload) {
        ctx.finalAnswerText = String(payload);
      }
      // 流结束：执行一次完整 Markdown 渲染（只此一次，不在 token 流中重复执行）
      answerContent.innerHTML = renderMarkdown(ctx.finalAnswerText);
      answerContent.classList.remove('streaming');
      if (ctx.hasThinking) {
        summary.innerHTML = `已完成推理（${ctx.stepCount} 步）`;
        details.open = false;
      } else {
        // 无工具调用时隐藏思考面板
        details.style.display = 'none';
      }
      scrollToBottom();
      break;
    }
    case 'error': {
      const errMsg = typeof payload === 'string' ? payload : formatJson(payload);
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = '错误：' + errMsg;
      answerContent.appendChild(errDiv);
      details.style.display = 'none';
      break;
    }
  }
}

async function streamChat(userMessage) {
  if (isStreaming) return;
  isStreaming = true;
  sendBtn.disabled = true;
  toolCardMap.clear();

  conversationHistory.push({ role: 'user', content: userMessage });
  appendUserMessage(userMessage);

  const { details, summary, thinkingContent, answerContent } = createAssistantMessage();

  // 共享上下文对象
  const ctx = {
    finalAnswerText: '',
    hasThinking: false,
    thinkingContent,
    summary,
    details,
    answerContent,
  };

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();

      if (value) {
        buffer += decoder.decode(value, { stream: true });
      }

      // 按 \r\n\r\n 或 \n\n 切割完整事件（sse-starlette 使用 \r\n\r\n），不完整的留在 buffer
      const parts = buffer.split(/\r?\n\r?\n/);

      if (done) {
        // 流已结束：所有 parts 都处理（包括最后一个可能不含 \n\n 的残余）
        for (const eventStr of parts) {
          if (eventStr.trim()) processSseEvent(eventStr, ctx);
        }
        break;
      } else {
        // 流未结束：最后一段可能不完整，留待下次
        buffer = parts.pop() || '';
        for (const eventStr of parts) {
          if (eventStr.trim()) processSseEvent(eventStr, ctx);
        }
      }
    }

    // 流结束后兜底：如果 final_answer 没有处理成功
    if (!ctx.finalAnswerText) {
      if (ctx.hasThinking) {
        summary.innerHTML = `已完成推理（${ctx.stepCount} 步）`;
        details.open = false;
      } else {
        details.style.display = 'none';
      }
      answerContent.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">（未收到回答内容）</p>';
    } else {
      conversationHistory.push({ role: 'assistant', content: ctx.finalAnswerText });
    }

  } catch (err) {
    console.error('[streamChat error]', err);
    answerContent.innerHTML = `<div class="error-message">连接失败：${escapeHtml(err.message)}</div>`;
    details.style.display = 'none';
    summary.innerHTML = '请求失败';
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    userInput.focus();
    scrollToBottom();
  }
}

// ============================================================
// 输入框自适应高度
// ============================================================
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
});

// ============================================================
// 事件绑定
// ============================================================
function handleSend() {
  const text = userInput.value.trim();
  if (!text || isStreaming) return;
  userInput.value = '';
  userInput.style.height = 'auto';
  streamChat(text);
}

sendBtn.addEventListener('click', handleSend);

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// 页面加载后聚焦输入框
userInput.focus();
</script>
